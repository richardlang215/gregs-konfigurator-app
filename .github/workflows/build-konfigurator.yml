name: Sestavit APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rozbalit projekt
        run: |
          ZIP=$(ls *.zip 2>/dev/null | head -n 1)
          if [ -n "$ZIP" ]; then
            unzip -q -o "$ZIP" -d build-src
            PROJ=$(dirname "$(find build-src -name settings.gradle.kts | head -n 1)")
          else
            PROJ=.
          fi
          echo "PROJ=$PROJ" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Sestavit
        working-directory: ${{ env.PROJ }}
        run: gradle assembleRelease --stacktrace

      - name: Zveřejnit APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          NAME="${{ github.event.repository.name }}.apk"
          cp "$PROJ/app/build/outputs/apk/release/app-release.apk" "$NAME"
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "$NAME" \
            --target "${{ github.sha }}" \
            --title "Sestavení ${{ github.run_number }}" \
            --notes "Automaticky sestaveno z commitu ${{ github.sha }}"
